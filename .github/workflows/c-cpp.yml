name: Build NextSNESControllerTool

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSVC Dev Cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile
        run: |
          cl /EHsc /O2 /Fe:NextSNESControllerTool.exe ^
             src\main.cpp ^
             src\xml_parser.cpp ^
             src\http_client.cpp ^
             src\usb_device.cpp ^
             /I src ^
             user32.lib gdi32.lib winhttp.lib setupapi.lib hid.lib cfgmgr32.lib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextSNESControllerTool-Windows
          path: NextSNESControllerTool.exe
