name: Build NextSNESControllerTool

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile Project
        run: |
          # 1. Сначала превращаем resource.rc в ресурс (resource.res)
          rc /fo resource.res resource.rc
          
          # 2. Собираем exe. 
          # ВАЖНО: resource.res стоит в списке файлов, иначе иконки не будет.
          # Флаг /DUNICODE обязателен для работы с wchar_t (строки в Windows)
          cl /EHsc /O2 /DUNICODE /Fe:NextSNESControllerTool.exe src\main.cpp src\xml_parser.cpp src\http_client.cpp src\usb_device.cpp resource.res /I src user32.lib gdi32.lib winhttp.lib setupapi.lib hid.lib cfgmgr32.lib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextSNESControllerTool-Windows
          path: NextSNESControllerTool.exe
